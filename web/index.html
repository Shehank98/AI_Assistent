<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <title>Jarvis</title>
</head>
<body>

  <!-- Notification banner -->
  <div id="alert-banner" class="alert-banner hidden">
    <span id="alert-text"></span>
    <button id="alert-close">✕</button>
  </div>

  <!-- Header -->
  <header>
    <div id="jarvis-avatar" class="avatar" title="Jarvis">J</div>
    <h1>J.A.R.V.I.S</h1>
    <div id="status-dot" class="dot offline" title="Connecting..."></div>
    <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
  </header>

  <!-- Conversation -->
  <main id="conversation"></main>

  <!-- Footer / Input -->
  <footer>
    <div id="input-row">
      <div id="mic-wrap">
        <button id="mic-btn" class="icon-btn mic" title="Voice input">🎤</button>
        <div id="mic-ring" class="mic-ring"></div>
      </div>
      <div id="waveform" class="waveform hidden">
        <div class="wbar"></div>
        <div class="wbar"></div>
        <div class="wbar"></div>
        <div class="wbar"></div>
        <div class="wbar"></div>
      </div>
      <textarea
        id="text-input"
        placeholder="Message Jarvis…"
        rows="1"
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
      ></textarea>
      <button id="stop-btn" class="stop-btn" title="Stop / Interrupt" style="display:none">⬛</button>
      <button id="send-btn" class="send-btn" title="Send">▶</button>
    </div>
    <div id="voice-status"></div>
  </footer>

  <!-- Settings Drawer -->
  <div id="settings-overlay" class="hidden"></div>
  <aside id="settings-drawer" class="closed">
    <div class="drawer-header">
      <h2>Settings</h2>
      <button id="settings-close" class="icon-btn">✕</button>
    </div>

    <div class="setting-row">
      <label for="tts-toggle">Voice responses</label>
      <input type="checkbox" id="tts-toggle" class="toggle">
    </div>

    <div class="setting-row">
      <label for="continuous-toggle">Continuous mode</label>
      <input type="checkbox" id="continuous-toggle" class="toggle">
    </div>

    <div class="setting-row">
      <div style="display:flex;flex-direction:column;gap:2px">
        <label for="server-stt-toggle" style="font-size:14px">Server STT</label>
        <span style="font-size:11px;color:var(--text-muted)">Better accuracy for Sinhala &amp; Tamil</span>
      </div>
      <input type="checkbox" id="server-stt-toggle" class="toggle">
    </div>

    <div class="setting-row">
      <span>Connection</span>
      <span id="conn-status-text" class="status-text">—</span>
    </div>

    <div class="setting-row">
      <span>Tools active</span>
      <span id="tool-count-text" class="status-text">—</span>
    </div>

    <div class="setting-row" id="token-row">
      <label for="token-input" style="font-size:13px">Access token</label>
      <input type="password" id="token-input" class="token-input" placeholder="JARVIS_ACCESS_TOKEN" autocomplete="current-password">
    </div>

    <button id="clear-btn" class="danger-btn">Clear conversation</button>

    <div class="memory-section">
      <h3>What Jarvis remembers</h3>
      <div id="memory-list" class="memory-list">Loading...</div>
      <button id="refresh-memory" class="secondary-btn">Refresh</button>
    </div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
